<!DOCTYPE html><html><head><meta charset="utf-8"><title>NTTC Block 2 Compatibility Tests</title><style>body{font-family:Segoe UI,Arial;padding:30px;background:#f4f7fb}.box{max-width:900px;margin:auto;background:#fff;padding:24px;border-radius:16px}.pass{color:#067647}.fail{color:#b42318}pre{line-height:1.7}</style></head><body><div class="box"><h1>NTTC Block 2 Compatibility Tests</h1><pre id="out"></pre></div>
<script src="../JS/core/namespace.js"></script><script src="../JS/config/nttc.constants.js"></script><script src="../JS/core/storage/local.storage.js"></script><script src="../Modules/workflow/services/nttc.workflow.service.js"></script><script src="../Modules/applicant/models/applicant.model.js"></script><script src="../Modules/applicant/validation/applicant.validator.js"></script><script src="../Modules/applicant/repository/applicant.repository.js"></script><script src="../Modules/applicant/services/applicant.service.js"></script><script src="../Modules/qualification/repository/qualification.repository.js"></script><script src="../Modules/qualification/services/qualification.service.js"></script><script src="../Modules/application/models/nttc.application.model.js"></script><script src="../Modules/application/validation/nttc.prerequisite.validator.js"></script><script src="../Modules/application/repository/nttc.application.repository.js"></script><script src="../Modules/application/services/nttc.application.service.js"></script>
<script>const out=document.getElementById('out');let a=[];function t(n,c){a.push((c?'PASS ':'FAIL ')+n)}const issued='2026-08-13',validNc='26050502006032';try{const x=TAESF.NTTC.ApplicantService.register({learnerId:'AJD-05-096-05005-001',lastName:'Test',firstName:'Applicant',email:'block2compat@example.com',mobile:'09171234567',address:'Albay',dateOfBirth:'1990-01-01'});t('Applicant registration',!!x.applicantId);const app=TAESF.NTTC.ApplicationService.create({applicantId:x.applicantId});const q=TAESF.NTTC.QualificationService.get('BPP-NCII');TAESF.NTTC.ApplicationService.saveDraft(app.applicationId,{qualificationCode:q.qualificationCode,qualificationTitle:q.qualificationTitle,sector:q.sector,credentials:{nc:{certificateNumber:validNc,qualificationCode:q.qualificationCode,level:'NC II',issuedOn:issued},tmc:{certificateNumber:'TMC-1',level:'I',issuedOn:issued}},applicationDetails:{tviName:'Test TVI',employmentStatus:'Permanent / Regular'}});const r=TAESF.NTTC.ApplicationService.checkPrerequisites(app.applicationId);t('Valid NC + TMC prerequisite gate',r.valid===true);t('Status becomes READY_FOR_ONLINE_SUBMISSION',TAESF.NTTC.ApplicationService.get(app.applicationId).status==='READY_FOR_ONLINE_SUBMISSION')}catch(e){t('Applicant/application happy path',false)}t('NC number/date internal consistency check',TAESF.NTTC.PrerequisiteValidator.ncNumberLooksConsistent(validNc,issued));t('NC number/date inconsistency blocked',!TAESF.NTTC.PrerequisiteValidator.ncNumberLooksConsistent('25050502006032',issued));t('Five-year validity calculation',TAESF.NTTC.PrerequisiteValidator.expectedValidity('2026-08-13')==='2031-08-13');t('Learner ID accepts three-character prefix including dot',TAESF.NTTC.ApplicantValidator.validate({learnerId:'AJ.-05-096-05005-001',lastName:'T',firstName:'A',email:'a@b.com',mobile:'09171234567',address:'A',dateOfBirth:'1990-01-01'}).valid);t('Qualification master loads',TAESF.NTTC.QualificationService.list().length>0);out.innerHTML=a.map(x=>`<span class="${x.startsWith('PASS')?'pass':'fail'}">${x}</span>`).join('\n')</script></body></html>
