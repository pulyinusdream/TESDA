<!DOCTYPE html><html><head><meta charset="UTF-8"><title>NTTC Block 9 Tests</title><link rel="stylesheet" href="../CSS/app.css"></head><body><main class="nttc-shell"><header><h1>NTTC Block 9 Tests</h1><p>Certificate recording, release, and QR claim-stub lookup.</p></header><div id="out" class="test-output"></div></main>
<script src="../JS/core/namespace.js"></script><script src="../JS/config/nttc.constants.js"></script><script src="../JS/core/storage/local.storage.js"></script><script src="../Modules/workflow/services/nttc.workflow.service.js"></script><script src="../Modules/applicant/models/applicant.model.js"></script><script src="../Modules/applicant/repository/applicant.repository.js"></script><script src="../Modules/application/models/nttc.application.model.js"></script><script src="../Modules/application/repository/nttc.application.repository.js"></script><script src="../Modules/application/services/nttc.application.service.js"></script><script src="../Modules/certificate/repository/certificate.repository.js"></script><script src="../Modules/certificate/services/certificate.service.js"></script><script src="../Modules/scanner/services/qr.scanner.service.js"></script><script>
(()=>{const out=document.getElementById('out'),r=[];function t(name,ok){r.push(`${ok?'PASS':'FAIL'} ${name}`);}localStorage.removeItem('nttc.block1.applications');localStorage.removeItem('nttc.block9.certificates.meta');
const a=new TAESF.NTTC.ApplicationModel({applicantId:'P1',qualificationTitle:'Bread and Pastry Production NC II'});a.controlNumber='NTTC-R05-ALB-2026-000321';a.status=TAESF.NTTC.Constants.STATUS.REGIONAL_OFFICE_PROCESSING;TAESF.NTTC.ApplicationRepository.save(a);
t('Claim-stub QR/control number finds the exact application',TAESF.NTTC.QRScannerService.findApplication(a.controlNumber)?.applicationId===a.applicationId);
t('Unknown QR/control number does not open another application',TAESF.NTTC.QRScannerService.findApplication('NTTC-R05-ALB-2026-999999')===null);
t('Regional Office processing can transition to NTTC received',TAESF.NTTC.Workflow.canTransition(TAESF.NTTC.Constants.STATUS.REGIONAL_OFFICE_PROCESSING,TAESF.NTTC.Constants.STATUS.NTTC_RECEIVED_FROM_RO));
t('Certificate record can transition to ready for release',TAESF.NTTC.Workflow.canTransition(TAESF.NTTC.Constants.STATUS.CERTIFICATE_RECORDED,TAESF.NTTC.Constants.STATUS.CERTIFICATE_READY_FOR_RELEASE));
t('Certificate ready can transition to released',TAESF.NTTC.Workflow.canTransition(TAESF.NTTC.Constants.STATUS.CERTIFICATE_READY_FOR_RELEASE,TAESF.NTTC.Constants.STATUS.RELEASED));
t('Released application can transition to closed',TAESF.NTTC.Workflow.canTransition(TAESF.NTTC.Constants.STATUS.RELEASED,TAESF.NTTC.Constants.STATUS.CLOSED));
t('Applicant stage for certificate ready is CERTIFICATE READY FOR RELEASE',TAESF.NTTC.Workflow.applicantStage(TAESF.NTTC.Constants.STATUS.CERTIFICATE_READY_FOR_RELEASE)===TAESF.NTTC.Constants.APPLICANT_STAGE.READY);
out.textContent=r.join('\n');})();
</script></body></html>
