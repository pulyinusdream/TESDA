<!DOCTYPE html><html><head><meta charset="UTF-8"><title>NTTC Block 7 Tests</title><style>body{font:15px Arial;padding:30px;background:#f5f7fa}.pass{color:#087a43}.fail{color:#b42318}li{margin:8px 0}</style></head><body><h1>NTTC Block 7 Tests</h1><ul id="out"></ul>
<script src="../JS/core/namespace.js"></script><script src="../JS/config/nttc.constants.js"></script><script src="../JS/core/storage/local.storage.js"></script><script src="../Modules/workflow/services/nttc.workflow.service.js"></script><script src="../Modules/application/models/nttc.application.model.js"></script><script src="../Modules/application/repository/nttc.application.repository.js"></script><script src="../Modules/application/services/nttc.application.service.js"></script><script src="../Modules/hardcopy/repository/hardcopy.repository.js"></script><script src="../Modules/hardcopy/services/hardcopy.service.js"></script><script src="../Modules/forms/services/cocie.form.service.js"></script><script>
const out=document.getElementById('out');function test(name,fn){try{if(!fn())throw new Error('false');out.innerHTML+=`<li class="pass">PASS ${name}</li>`}catch(e){out.innerHTML+=`<li class="fail">FAIL ${name}: ${e.message}</li>`}}
TAESF.NTTC.LocalStorage.remove('nttc.block2.applications');TAESF.NTTC.LocalStorage.remove('nttc.block7.hardcopy.records');
const a=new TAESF.NTTC.ApplicationModel({applicantId:'A1',controlNumber:'NTTC-R05-ALB-2026-000123',status:TAESF.NTTC.Constants.STATUS.APPROVED_FOR_HARDCOPY_SUBMISSION,qualificationTitle:'Bread and Pastry Production NC II',applicationDetails:{tviName:'Sample TVI'}});TAESF.NTTC.ApplicationRepository.save(a);
test('Form A is available after CAC hard-copy approval',()=>TAESF.NTTC.CoCIEFormService.canGenerate(a));
TAESF.NTTC.CoCIEFormService.saveEndorser(a.applicationId,'JUAN A. ADMINISTRATOR');test('TVI Administrator/President endorser is saved per application',()=>TAESF.NTTC.ApplicationRepository.findById(a.applicationId).applicationDetails.endorserName==='JUAN A. ADMINISTRATOR');
TAESF.NTTC.HardcopyService.saveAppointment(a.applicationId,{date:'2026-08-20',timeFrom:'09:00',timeTo:'11:00',venue:'TESDA Albay Provincial Office',instructions:'Bring notarized Form A.'});test('CAC scheduling moves status to SUBMISSION_SCHEDULED',()=>TAESF.NTTC.ApplicationRepository.findById(a.applicationId).status===TAESF.NTTC.Constants.STATUS.SUBMISSION_SCHEDULED);
TAESF.NTTC.HardcopyService.confirmAppointment(a.applicationId);test('Applicant confirmation moves status to APPOINTMENT_CONFIRMED',()=>TAESF.NTTC.ApplicationRepository.findById(a.applicationId).status===TAESF.NTTC.Constants.STATUS.APPOINTMENT_CONFIRMED);
TAESF.NTTC.HardcopyService.confirmArrival(a.applicationId);test('CAC arrival confirmation moves status to APPLICANT_ARRIVED',()=>TAESF.NTTC.ApplicationRepository.findById(a.applicationId).status===TAESF.NTTC.Constants.STATUS.APPLICANT_ARRIVED);
TAESF.NTTC.HardcopyService.saveVerification(a.applicationId,{notarizedFormA:true,ncHardcopy:true,tmcHardcopy:true,iwerHardcopy:true,originalsPresented:true,remarks:'Complete'});test('Hard-copy checklist can be completed',()=>TAESF.NTTC.HardcopyService.checklistComplete(TAESF.NTTC.HardcopyService.get(a.applicationId).verification));
const rec=TAESF.NTTC.HardcopyService.receive(a.applicationId,'CAC FOCAL');test('Receiving complete hard copy generates claim stub number',()=>/^CS-NTTC-2026-000123$/.test(rec.claimStubNumber));test('Receipt advances application to FOR_PO_PROCESSING',()=>TAESF.NTTC.ApplicationRepository.findById(a.applicationId).status===TAESF.NTTC.Constants.STATUS.FOR_PO_PROCESSING);
</script></body></html>
