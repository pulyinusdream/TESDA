<!DOCTYPE html><html><head><meta charset="utf-8"><title>NTTC Block 3 Tests</title><style>body{font-family:Segoe UI,Arial;padding:30px;background:#f4f7fb}.box{max-width:900px;margin:auto;background:#fff;padding:24px;border-radius:16px}.pass{color:#067647}.fail{color:#b42318}pre{line-height:1.7}</style></head><body><div class="box"><h1>NTTC Block 3 Tests</h1><pre id="out"></pre></div>
<script src="../JS/core/namespace.js"></script><script src="../JS/config/nttc.constants.js"></script><script src="../JS/core/storage/local.storage.js"></script><script src="../Modules/workflow/services/nttc.workflow.service.js"></script><script src="../Modules/applicant/models/applicant.model.js"></script><script src="../Modules/qualification/repository/qualification.repository.js"></script><script src="../Modules/qualification/services/qualification.service.js"></script><script src="../Modules/application/models/nttc.application.model.js"></script><script src="../Modules/application/validation/nttc.prerequisite.validator.js"></script><script src="../Modules/application/repository/nttc.application.repository.js"></script><script src="../Modules/documents/models/document.model.js"></script><script src="../Modules/documents/repository/document.repository.js"></script><script src="../Modules/documents/services/document.service.js"></script><script src="../Modules/application/services/nttc.control-number.service.js"></script><script src="../Modules/application/services/nttc.application.service.js"></script>
<script>
const out=document.getElementById('out');let lines=[];function test(name,fn){try{if(!fn())throw new Error('false');lines.push('PASS '+name);}catch(e){lines.push('FAIL '+name+' :: '+e.message);}}function isoYearsAgo(n){const d=new Date();d.setFullYear(d.getFullYear()-n);return d.toISOString().slice(0,10);}function currentYearDate(){return new Date().toISOString().slice(0,10);}localStorage.removeItem('nttc.block3.documents.meta');
const V=TAESF.NTTC.PrerequisiteValidator;
test('Five-year expected validity',()=>{const d=V.expectedValidity('2026-08-13');return d==='2031-08-13';});
test('Credential inside five years is valid',()=>V.credentialStillValid(isoYearsAgo(1))===true);
test('Credential beyond five years is blocked',()=>V.credentialStillValid(isoYearsAgo(6))===false);
test('NC number/date internal consistency',()=>V.ncNumberLooksConsistent('26050502006032','2026-08-13')===true);
test('NC number/date inconsistency blocked',()=>V.ncNumberLooksConsistent('25050502006032','2026-08-13')===false);
const app=new TAESF.NTTC.ApplicationModel({applicantId:'TEST-A',qualificationCode:'BPP-NCII',qualificationTitle:'Bread and Pastry Production NC II',sector:'Tourism',credentials:{nc:{certificateNumber:'26050502006032',qualificationCode:'BPP-NCII',level:'NC II',issuedOn:'2026-08-13'},tmc:{certificateNumber:'TMC-TEST-001',level:'I',issuedOn:'2026-08-13'}},applicationDetails:{tviName:'Test TVI',employmentStatus:'Permanent / Regular',yearsTeaching:'3',notes:''}});
test('TVI and employment status prerequisite accepted',()=>V.validate(app).valid===true);
const bad=new TAESF.NTTC.ApplicationModel(JSON.parse(JSON.stringify(app)));bad.applicationDetails.tviName='';test('TVI is required',()=>V.validate(bad).valid===false);
['NC_CERTIFICATE','TMC_CERTIFICATE','IWER_EVIDENCE'].forEach((type,i)=>TAESF.NTTC.DocumentRepository.saveMeta(new TAESF.NTTC.DocumentModel({applicationId:app.applicationId,documentType:type,modality:type==='IWER_EVIDENCE'?'PRE_SERVICE':'',fileName:'test'+i+'.pdf',mimeType:'application/pdf',sizeBytes:1000})));
test('Required documentary set is complete',()=>TAESF.NTTC.DocumentService.completeness(app.applicationId).complete===true);
const n=TAESF.NTTC.ControlNumberService.next(2026);test('Control number format',()=>/^NTTC-R05-ALB-2026-\d{6}$/.test(n));
app.status=TAESF.NTTC.Constants.STATUS.READY_FOR_ONLINE_SUBMISSION;TAESF.NTTC.ApplicationRepository.save(app);const submitted=TAESF.NTTC.ApplicationService.submitForInitialReview(app.applicationId);test('Submission moves to initial review',()=>submitted.status==='SUBMITTED_FOR_INITIAL_REVIEW'&&!!submitted.controlNumber&&!!submitted.submittedAt);
out.innerHTML=lines.map(x=>`<span class="${x.startsWith('PASS')?'pass':'fail'}">${x}</span>`).join('\n');
</script></body></html>
