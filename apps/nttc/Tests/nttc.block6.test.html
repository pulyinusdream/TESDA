<!DOCTYPE html><html><head><meta charset="utf-8"><title>NTTC Block 6 Test</title><style>body{font-family:Arial;padding:28px;background:#f4f7fb}.pass{color:#067647}.fail{color:#b42318}li{margin:8px 0}</style></head><body><h1>NTTC Block 6 — Applicant Portal, Multi-Application & Form A</h1><ul id="out"></ul>
<script src="../JS/core/namespace.js"></script><script src="../JS/config/nttc.constants.js"></script><script src="../JS/core/storage/local.storage.js"></script><script src="../Modules/workflow/services/nttc.workflow.service.js"></script><script src="../Modules/applicant/models/applicant.model.js"></script><script src="../Modules/applicant/repository/applicant.repository.js"></script><script src="../Modules/applicant/services/applicant.service.js"></script><script src="../Modules/application/models/nttc.application.model.js"></script><script src="../Modules/application/repository/nttc.application.repository.js"></script><script src="../Modules/documents/models/document.model.js"></script><script src="../Modules/documents/repository/document.repository.js"></script><script src="../Modules/documents/services/document.service.js"></script><script src="../Modules/forms/services/cocie.form.service.js"></script><script src="../Modules/portal/views/applicant.portal.view.js"></script>
<script>
const out=document.getElementById('out');function test(name,fn){try{if(!fn())throw new Error('false');out.innerHTML+=`<li class="pass">PASS ${name}</li>`;}catch(e){out.innerHTML+=`<li class="fail">FAIL ${name}: ${e.message}</li>`;}}
localStorage.removeItem('nttc.block2.applications');localStorage.removeItem('nttc.block2.applicants');
const a=new TAESF.NTTC.ApplicantModel({learnerId:'AJD-05-096-05005-001',firstName:'Juan',lastName:'Dela Cruz',email:'block6@example.com',mobile:'09171234567',address:'Albay',dateOfBirth:'1990-01-01'});TAESF.NTTC.ApplicantRepository.save(a);
const app1=new TAESF.NTTC.ApplicationModel({applicantId:a.applicantId,qualificationTitle:'Bread and Pastry Production NC II',status:TAESF.NTTC.Constants.STATUS.APPROVED_FOR_HARDCOPY_SUBMISSION,controlNumber:'NTTC-R05-ALB-2026-000001'});TAESF.NTTC.ApplicationRepository.save(app1);
const app2=new TAESF.NTTC.ApplicationModel({applicantId:a.applicantId,qualificationTitle:'Cookery NC II',status:TAESF.NTTC.Constants.STATUS.DRAFT});TAESF.NTTC.ApplicationRepository.save(app2);
test('One applicant can retain multiple NTTC applications',()=>TAESF.NTTC.ApplicationRepository.byApplicant(a.applicantId).length===2);
test('Applicant process map contains seven end-to-end stages',()=>TAESF.NTTC.ApplicantPortalView.process(app1).length===7);
test('Approved application process map current stage is Hard-Copy Submission',()=>TAESF.NTTC.ApplicantPortalView.process(app1).find(x=>x.state==='current').key==='hardcopy');
test('Form A generation is enabled only after CAC hard-copy approval',()=>TAESF.NTTC.CoCIEFormService.canGenerate(app1)===true&&TAESF.NTTC.CoCIEFormService.canGenerate(app2)===false);
const doc=new TAESF.NTTC.DocumentModel({applicationId:app1.applicationId,documentType:'IWER_EVIDENCE',modality:'PRE_SERVICE',title:'Certificate of Employment',fromDate:'2020-01-01',toDate:'2021-01-01',claimedHours:2312,fileName:'coe.pdf'});TAESF.NTTC.DocumentRepository.saveMeta(doc);
test('IWER evidence retains inclusive dates and estimated hours for Form A',()=>{const r=TAESF.NTTC.CoCIEFormService.evidenceRows(app1.applicationId)[0];return r.fromDate==='2020-01-01'&&r.toDate==='2021-01-01'&&Number(r.estimatedHours)===2312;});
test('Form A maps Pre-Service evidence to modality A',()=>TAESF.NTTC.CoCIEFormService.modalityLetter('PRE_SERVICE')==='A');
test('Generated Form A URL preserves application identity',()=>TAESF.NTTC.CoCIEFormService.url(app1.applicationId).includes(encodeURIComponent(app1.applicationId)));
</script></body></html>
