<!DOCTYPE html><html><head><meta charset="utf-8"><title>NTTC Block 4 Tests</title></head><body><pre id="out"></pre>
<script src="../JS/core/namespace.js"></script><script src="../JS/config/nttc.constants.js"></script><script src="../JS/core/storage/local.storage.js"></script><script src="../Modules/workflow/services/nttc.workflow.service.js"></script><script src="../Modules/applicant/models/applicant.model.js"></script><script src="../Modules/applicant/repository/applicant.repository.js"></script><script src="../Modules/application/models/nttc.application.model.js"></script><script src="../Modules/application/repository/nttc.application.repository.js"></script><script src="../Modules/application/services/nttc.application.service.js"></script><script src="../Modules/documents/models/document.model.js"></script><script src="../Modules/documents/repository/document.repository.js"></script><script src="../Modules/documents/services/document.service.js"></script><script src="../Modules/review/models/deficiency.model.js"></script><script src="../Modules/review/repository/screening.repository.js"></script><script src="../Modules/review/repository/deficiency.repository.js"></script><script src="../Modules/review/services/focal.review.service.js"></script>
<script>
const O=document.getElementById('out');function t(name,fn){try{fn();O.textContent+='PASS '+name+'\n';}catch(e){O.textContent+='FAIL '+name+' — '+e.message+'\n';}}
localStorage.removeItem('nttc.block2.applications');localStorage.removeItem('nttc.block4.screening');localStorage.removeItem('nttc.block4.deficiencies');localStorage.removeItem('nttc.block3.documents.meta');
const S=TAESF.NTTC.Constants.STATUS;const app=TAESF.NTTC.ApplicationRepository.save(new TAESF.NTTC.ApplicationModel({applicantId:'A1',controlNumber:'NTTC-R05-ALB-2026-000001',status:S.SUBMITTED_FOR_INITIAL_REVIEW,submittedAt:new Date().toISOString()}));
t('Submitted application appears in focal queue',()=>{if(!TAESF.NTTC.FocalReviewService.queue().some(x=>x.applicationId===app.applicationId))throw Error('not queued');});
t('Focal begins initial review',()=>{if(TAESF.NTTC.FocalReviewService.beginReview(app.applicationId).status!==S.UNDER_INITIAL_REVIEW)throw Error('wrong status');});
const doc={documentId:'D1',applicationId:app.applicationId,documentType:'NC_CERTIFICATE',title:'National Certificate'};TAESF.NTTC.DocumentRepository.saveMeta(doc);
t('Document finding can be saved',()=>{const r=TAESF.NTTC.FocalReviewService.saveDocumentFinding(app.applicationId,'D1','DEFICIENT','Unreadable copy');if(r.findingStatus!=='DEFICIENT')throw Error('not saved');});
t('Deficiency can be created',()=>{TAESF.NTTC.FocalReviewService.createDeficiency(app.applicationId,'D1','NC copy is unreadable','Upload a clear copy of the NC');if(TAESF.NTTC.DeficiencyRepository.openForApplication(app.applicationId).length!==1)throw Error('missing');});
t('Application can be returned with deficiencies',()=>{if(TAESF.NTTC.FocalReviewService.issueDeficiencies(app.applicationId).status!==S.WITH_DEFICIENCY)throw Error('wrong status');});
t('Applicant stage maps deficiency to compliance',()=>{if(TAESF.NTTC.Workflow.applicantStage(S.WITH_DEFICIENCY)!==TAESF.NTTC.Constants.APPLICANT_STAGE.COMPLIANCE)throw Error('wrong applicant stage');});
</script></body></html>
